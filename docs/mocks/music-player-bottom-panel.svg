<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1080" viewBox="0 0 1640 1080" font-family="Manrope, Segoe UI, sans-serif">
  <defs>
    <style>
      .paper { fill: #12161A; }
      .raised { fill: #1A1F26; }
      .line { stroke: #2B323B; fill: none; }
      .ink { fill: #EEF2F3; }
      .muted { fill: #8B96A1; }
      .brass { fill: #33E2B8; }
      .brassdark { fill: #1C8A71; }
      .brasssoft { fill: #15332D; }
      .disp { font-family: "Space Grotesk", Segoe UI, sans-serif; font-weight: 600; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .lbl { font-size: 13px; }
      .cap { font-size: 11px; }
    </style>
  </defs>

  <rect width="1640" height="1080" class="paper"/>

  <!-- ================= TITLES ================= -->
  <text x="40" y="44" class="disp ink" font-size="22">Music Library &#8250; Music Player &#8212; transport moved to a bottom panel</text>
  <text x="40" y="68" class="muted" font-size="13">Mock &#183; Signal Deck tokens &#183; left: desktop &#8805;1024px &#183; right: compact &lt;1024px</text>

  <!-- ================= DESKTOP FRAME ================= -->
  <g transform="translate(40,100)">
    <text x="0" y="-8" class="disp muted" font-size="12">DESKTOP &#8212; 1024px+ (nav tree omitted)</text>
    <rect x="0" y="0" width="1000" height="900" rx="14" class="raised"/>
    <rect x="0" y="0" width="1000" height="900" rx="14" class="line"/>

    <!-- content area above the panel -->
    <!-- cover -->
    <rect x="28" y="28" width="300" height="300" rx="12" class="paper"/>
    <rect x="28" y="28" width="300" height="300" rx="12" class="line"/>
    <g opacity="0.5">
      <circle cx="178" cy="178" r="78" class="line" stroke-width="2"/>
      <circle cx="178" cy="178" r="26" class="line" stroke-width="2"/>
      <circle cx="178" cy="178" r="5" class="brassdark"/>
    </g>
    <text x="178" y="352" class="muted cap" text-anchor="middle">album cover (unchanged)</text>

    <!-- metadata -->
    <text x="28" y="404" class="disp ink" font-size="21">Ramble On</text>
    <text x="28" y="428" class="muted" font-size="14">Led Zeppelin</text>
    <text x="28" y="448" class="muted" font-size="12">Led Zeppelin II</text>

    <!-- tabs panel to the right -->
    <rect x="360" y="28" width="612" height="620" rx="12" class="paper"/>
    <rect x="360" y="28" width="612" height="620" rx="12" class="line"/>
    <g>
      <rect x="376" y="44" width="76" height="30" rx="15" class="brass"/>
      <text x="414" y="64" class="paper" font-size="12" font-weight="600" text-anchor="middle" fill="#12161A">Lyrics</text>
      <text x="476" y="64" class="muted" font-size="12">Story</text>
      <text x="532" y="64" class="muted" font-size="12">Video</text>
      <text x="588" y="64" class="muted" font-size="12">Visual</text>
      <line x1="376" y1="86" x2="956" y2="86" class="line"/>
    </g>
    <g class="muted" font-size="13">
      <text x="376" y="118">Leaves are falling all around</text>
      <text x="376" y="142">It's time I was on my way</text>
      <text x="376" y="166">Thanks to you I'm much obliged</text>
      <text x="376" y="190">For such a pleasant stay</text>
      <text x="376" y="226">But now it's time for me to go</text>
      <text x="376" y="250">The autumn moon lights my way</text>
      <text x="376" y="274">For now I smell the rain</text>
      <text x="376" y="298">And with it pain</text>
      <text x="376" y="322">And it's headed my way</text>
    </g>
    <text x="376" y="620" class="muted cap">Matched on Ramble On &#8212; Led Zeppelin &#183; from lrclib.net</text>

    <!-- ===== THE BOTTOM PANEL (desktop) ===== -->
    <g transform="translate(0,680)">
      <rect x="20" y="0" width="960" height="196" rx="14" class="paper"/>
      <rect x="20" y="0" width="960" height="196" rx="14" class="line"/>

      <!-- seek row -->
      <text x="44" y="42" class="mono muted" font-size="12">1:24</text>
      <rect x="86" y="34" width="828" height="4" rx="2" fill="#2B323B"/>
      <rect x="86" y="34" width="296" height="4" rx="2" class="brass"/>
      <circle cx="382" cy="36" r="7" class="brass"/>
      <text x="934" y="42" class="mono muted" font-size="12">4:34</text>

      <!-- divider -->
      <line x1="44" y1="68" x2="956" y2="68" class="line"/>

      <!-- transport cluster: centered -->
      <g transform="translate(0,104)">
        <!-- previous -->
        <g>
          <rect x="330" y="-22" width="52" height="46" rx="23" fill="#1C222A"/>
          <rect x="330" y="-22" width="52" height="46" rx="23" class="line"/>
          <rect x="330" y="20" width="52" height="4" rx="2" fill="#2B323B"/>
          <path d="M364 -8 L352 1 L364 10 Z" class="ink"/>
          <rect x="348" y="-8" width="3" height="18" class="ink"/>
        </g>
        <!-- play: primary, larger -->
        <g>
          <rect x="400" y="-30" width="64" height="60" rx="30" class="brass"/>
          <rect x="400" y="26" width="64" height="4" rx="2" class="brassdark"/>
          <rect x="422" y="-12" width="6" height="24" fill="#12161A"/>
          <rect x="436" y="-12" width="6" height="24" fill="#12161A"/>
        </g>
        <!-- next -->
        <g>
          <rect x="482" y="-22" width="52" height="46" rx="23" fill="#1C222A"/>
          <rect x="482" y="-22" width="52" height="46" rx="23" class="line"/>
          <rect x="482" y="20" width="52" height="4" rx="2" fill="#2B323B"/>
          <path d="M500 -8 L512 1 L500 10 Z" class="ink"/>
          <rect x="513" y="-8" width="3" height="18" class="ink"/>
        </g>

        <!-- volume, left of the transport -->
        <g transform="translate(44,0)">
          <path d="M4 -7 L12 -7 L21 -16 L21 16 L12 7 L4 7 Z" class="muted"/>
          <path d="M27 -7 A 11 11 0 0 1 27 7" stroke="#8B96A1" stroke-width="2" fill="none"/>
          <rect x="44" y="-2" width="190" height="4" rx="2" fill="#2B323B"/>
          <rect x="44" y="-2" width="128" height="4" rx="2" class="brass"/>
          <circle cx="172" cy="0" r="7" class="brass"/>
          <text x="244" y="5" class="mono muted" font-size="11">65%</text>
        </g>

        <!-- right cluster: sleep timer + close -->
        <g transform="translate(624,0)">
          <rect x="0" y="-18" width="128" height="38" rx="19" fill="#1C222A"/>
          <rect x="0" y="-18" width="128" height="38" rx="19" class="line"/>
          <rect x="0" y="16" width="128" height="4" rx="2" fill="#2B323B"/>
          <circle cx="24" cy="0" r="8" class="line" stroke-width="1.5"/>
          <path d="M24 -5 L24 0 L28 2" stroke="#8B96A1" stroke-width="1.5" fill="none"/>
          <text x="42" y="5" class="ink" font-size="12">Sleep timer</text>

          <rect x="144" y="-18" width="140" height="38" rx="19" fill="#1C222A"/>
          <rect x="144" y="-18" width="140" height="38" rx="19" class="line"/>
          <rect x="144" y="16" width="140" height="4" rx="2" fill="#2B323B"/>
          <path d="M166 -6 L178 6 M178 -6 L166 6" stroke="#8B96A1" stroke-width="2"/>
          <text x="190" y="5" class="ink" font-size="12">Close player</text>
        </g>
      </g>

      <text x="44" y="178" class="muted cap">Panel sits at the bottom of the page column &#8212; it scrolls with the page, it is not fixed to the viewport.</text>
    </g>

    <!-- annotation arrow -->
    <g opacity="0.9">
      <path d="M1000 760 L1040 760" stroke="#33E2B8" stroke-width="2" fill="none"/>
      <circle cx="1040" cy="760" r="3" class="brass"/>
    </g>
  </g>

  <!-- ================= COMPACT FRAME ================= -->
  <g transform="translate(1180,100)">
    <text x="0" y="-8" class="disp muted" font-size="12">COMPACT &#8212; &lt;1024px</text>
    <rect x="0" y="0" width="390" height="900" rx="20" class="raised"/>
    <rect x="0" y="0" width="390" height="900" rx="20" class="line"/>

    <!-- cover -->
    <rect x="20" y="20" width="350" height="260" rx="12" class="paper"/>
    <rect x="20" y="20" width="350" height="260" rx="12" class="line"/>
    <g opacity="0.5">
      <circle cx="195" cy="150" r="66" class="line" stroke-width="2"/>
      <circle cx="195" cy="150" r="22" class="line" stroke-width="2"/>
      <circle cx="195" cy="150" r="4" class="brassdark"/>
    </g>

    <text x="20" y="312" class="disp ink" font-size="18">Ramble On</text>
    <text x="20" y="334" class="muted" font-size="13">Led Zeppelin</text>

    <!-- tabs -->
    <rect x="20" y="352" width="350" height="268" rx="12" class="paper"/>
    <rect x="20" y="352" width="350" height="268" rx="12" class="line"/>
    <rect x="32" y="364" width="66" height="26" rx="13" class="brass"/>
    <text x="65" y="382" font-size="11" font-weight="600" text-anchor="middle" fill="#12161A">Lyrics</text>
    <text x="116" y="382" class="muted" font-size="11">Story</text>
    <text x="164" y="382" class="muted" font-size="11">Video</text>
    <text x="214" y="382" class="muted" font-size="11">Visual</text>
    <line x1="32" y1="400" x2="358" y2="400" class="line"/>
    <g class="muted" font-size="12">
      <text x="32" y="426">Leaves are falling all around</text>
      <text x="32" y="448">It's time I was on my way</text>
      <text x="32" y="470">Thanks to you I'm much obliged</text>
      <text x="32" y="492">For such a pleasant stay</text>
    </g>

    <!-- ===== THE BOTTOM PANEL (compact): same panel, stacked rows ===== -->
    <g transform="translate(0,640)">
      <rect x="20" y="0" width="350" height="166" rx="14" class="paper"/>
      <rect x="20" y="0" width="350" height="166" rx="14" class="line"/>

      <!-- seek -->
      <rect x="36" y="22" width="318" height="4" rx="2" fill="#2B323B"/>
      <rect x="36" y="22" width="112" height="4" rx="2" class="brass"/>
      <circle cx="148" cy="24" r="6" class="brass"/>
      <text x="36" y="48" class="mono muted" font-size="10">1:24</text>
      <text x="354" y="48" class="mono muted" font-size="10" text-anchor="end">4:34</text>

      <!-- transport row, centered -->
      <g transform="translate(0,86)">
        <g>
          <rect x="110" y="-20" width="44" height="40" rx="20" fill="#1C222A"/>
          <rect x="110" y="-20" width="44" height="40" rx="20" class="line"/>
          <rect x="110" y="16" width="44" height="4" rx="2" fill="#2B323B"/>
          <path d="M140 -7 L130 0 L140 7 Z" class="ink"/>
          <rect x="127" y="-7" width="3" height="14" class="ink"/>
        </g>
        <g>
          <rect x="166" y="-26" width="56" height="52" rx="26" class="brass"/>
          <rect x="166" y="22" width="56" height="4" rx="2" class="brassdark"/>
          <rect x="185" y="-11" width="5" height="22" fill="#12161A"/>
          <rect x="197" y="-11" width="5" height="22" fill="#12161A"/>
        </g>
        <g>
          <rect x="234" y="-20" width="44" height="40" rx="20" fill="#1C222A"/>
          <rect x="234" y="-20" width="44" height="40" rx="20" class="line"/>
          <rect x="234" y="16" width="44" height="4" rx="2" fill="#2B323B"/>
          <path d="M248 -7 L258 0 L248 7 Z" class="ink"/>
          <rect x="259" y="-7" width="3" height="14" class="ink"/>
        </g>
      </g>

      <!-- volume row -->
      <g transform="translate(0,138)">
        <path d="M38 -6 L45 -6 L52 -13 L52 13 L45 6 L38 6 Z" class="muted"/>
        <rect x="66" y="-2" width="236" height="4" rx="2" fill="#2B323B"/>
        <rect x="66" y="-2" width="154" height="4" rx="2" class="brass"/>
        <circle cx="220" cy="0" r="6" class="brass"/>
        <text x="354" y="4" class="mono muted" font-size="10" text-anchor="end">65%</text>
      </g>
    </g>

    <!-- overflow note: sleep/close move into a row above on compact -->
    <text x="20" y="836" class="muted cap">Sleep timer + Close player wrap to their own row</text>
    <text x="20" y="852" class="muted cap">below the panel on narrow screens.</text>

    <!-- shared chrome the panel must clear -->
    <g transform="translate(0,862)">
      <rect x="0" y="0" width="390" height="38" rx="0" fill="#1A1F26"/>
      <line x1="0" y1="0" x2="390" y2="0" class="line"/>
      <circle cx="26" cy="19" r="10" class="brasssoft"/>
      <text x="46" y="23" class="muted" font-size="10">shared MusicPlayerBar + section trigger &#8212; untouched</text>
    </g>
  </g>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(40,1024)">
    <circle cx="6" cy="-4" r="5" class="brass"/>
    <text x="20" y="0" class="muted" font-size="12">Accent = brass token. Buttons keep Button&#8217;s hard-offset shadow (the 4px slab under each pill).</text>
    <circle cx="6" cy="22" r="5" fill="#2B323B"/>
    <text x="20" y="26" class="muted" font-size="12">Nothing here is &#8220;fixed&#8221; &#8212; the bottom edge stays owned by MusicPlayerBar and the compact section trigger.</text>
  </g>
</svg>
